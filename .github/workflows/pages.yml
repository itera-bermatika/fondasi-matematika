name: Terbitkan bacaan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Periksa berkas website
        run: python3 scripts/check-site.py
      - name: Periksa perhitungan aktivitas persamaan
        run: node tests/persamaan-linear.test.cjs
      - name: Periksa bidang koordinat
        run: node tests/koordinat.test.cjs
      - name: Periksa grafik garis
        run: node tests/garis.test.cjs
      - name: Periksa aktivitas fungsi
        run: node tests/fungsi.test.cjs
      - name: Periksa domain dan range
        run: node tests/domain-range.test.cjs
      - name: Periksa operasi dan komposisi fungsi
        run: node tests/komposisi-fungsi.test.cjs
      - name: Periksa fungsi invers
        run: node tests/fungsi-invers.test.cjs
      - name: Periksa transformasi grafik
        run: node tests/transformasi-fungsi.test.cjs
      - name: Periksa fungsi kuadrat
        run: node tests/fungsi-kuadrat.test.cjs
      - name: Periksa fungsi polinomial
        run: node tests/fungsi-polinomial.test.cjs
      - name: Periksa fungsi rasional
        run: node tests/fungsi-rasional.test.cjs
      - name: Periksa fungsi eksponensial
        run: node tests/fungsi-eksponensial.test.cjs
      - name: Periksa logaritma
        run: node tests/fungsi-logaritma.test.cjs
      - name: Periksa persamaan eksponensial dan logaritma
        run: node tests/persamaan-eksponen-log.test.cjs
      - name: Periksa sudut dan radian
        run: node tests/sudut-radian.test.cjs
      - name: Periksa lingkaran satuan
        run: node tests/lingkaran-satuan.test.cjs
      - name: Periksa perbandingan trigonometri
        run: node tests/tangen.test.cjs
      - name: Periksa grafik sinus dan kosinus
        run: node tests/grafik-trigonometri.test.cjs
      - name: Periksa persamaan trigonometri
        run: node tests/persamaan-trigonometri.test.cjs
      - name: Periksa identitas trigonometri
        run: node tests/identitas-trigonometri.test.cjs
      - name: Periksa fungsi trigonometri invers
        run: node tests/trigonometri-invers.test.cjs
      - name: Periksa penerapan trigonometri
        run: node tests/penerapan-trigonometri.test.cjs
      - name: Periksa laju perubahan rata-rata
        run: node tests/laju-perubahan.test.cjs
      - name: Periksa gagasan limit
        run: node tests/gagasan-limit.test.cjs
      - name: Periksa perhitungan limit dasar
        run: node tests/limit-dasar.test.cjs
      - name: Periksa kekontinuan fungsi
        run: node tests/kekontinuan.test.cjs
      - name: Periksa limit tak hingga
        run: node tests/limit-tak-hingga.test.cjs
      - name: Periksa garis sekan dan singgung
        run: node tests/garis-singgung.test.cjs
      - name: Periksa cek kesiapan kalkulus
        run: node tests/kesiapan-kalkulus.test.cjs
      - name: Periksa representasi bilangan real
        run: node tests/bilangan-real.test.cjs
      - name: Periksa akar dan pangkat rasional
        run: node tests/bentuk-akar.test.cjs
      - name: Periksa kandidat solusi pecahan dan akar
        run: node tests/persamaan-pecahan-akar.test.cjs
      - name: Periksa operasi interval dan pertidaksamaan majemuk
        run: node tests/pertidaksamaan-majemuk.test.cjs
      - name: Periksa persamaan dan pertidaksamaan nilai mutlak
        run: node tests/nilai-mutlak.test.cjs
      - name: Periksa pertidaksamaan kuadrat dan tabel tanda
        run: node tests/pertidaksamaan-kuadrat.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
