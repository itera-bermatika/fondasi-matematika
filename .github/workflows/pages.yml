name: Terbitkan bacaan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Periksa berkas website
        run: python3 scripts/check-site.py
      - name: Periksa perhitungan aktivitas persamaan
        run: node tests/persamaan-linear.test.cjs
      - name: Periksa bidang koordinat
        run: node tests/koordinat.test.cjs
      - name: Periksa grafik garis
        run: node tests/garis.test.cjs
      - name: Periksa aktivitas fungsi
        run: node tests/fungsi.test.cjs
      - name: Periksa domain dan range
        run: node tests/domain-range.test.cjs
      - name: Periksa operasi dan komposisi fungsi
        run: node tests/komposisi-fungsi.test.cjs
      - name: Periksa fungsi invers
        run: node tests/fungsi-invers.test.cjs
      - name: Periksa transformasi grafik
        run: node tests/transformasi-fungsi.test.cjs
      - name: Periksa fungsi kuadrat
        run: node tests/fungsi-kuadrat.test.cjs
      - name: Periksa fungsi polinomial
        run: node tests/fungsi-polinomial.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
